    UnprotectMediaBody:
      properties:
        confirm:
          type: boolean
          const: true
          title: Confirm
        acknowledge_retention:
          type: boolean
          const: true
          title: Acknowledge Retention
      type: object
      required:
        - confirm
        - acknowledge_retention
      title: UnprotectMediaBody
    VLMMonitorRequest:
      properties:
        camera:
          type: string
          title: Camera
        condition:
          type: string
          title: Condition
        max_duration_minutes:
          type: integer
          title: Max Duration Minutes
          default: 60
        labels:
          items:
            type: string
          type: array
          title: Labels
          default: []
        zones:
          items:
            type: string
          type: array
          title: Zones
          default: []
      type: object
      required:
        - camera
        - condition
      title: VLMMonitorRequest
      description: Request model for starting a VLM watch job.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    VectorPreviewOptions:
      properties:
        min_distance:
          type: number
          maximum: 4096.0
          minimum: 0.0
          title: Min Distance
          default: 0.5
        max_distance:
          anyOf:
            - type: number
              maximum: 16384.0
              exclusiveMinimum: 0.0
            - type: 'null'
          title: Max Distance
        min_activity:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Activity
          default: 0
        auto_tune:
          type: boolean
          title: Auto Tune
          default: false
      additionalProperties: false
      type: object
      title: VectorPreviewOptions
      description: Temporary preview settings, never changes to the camera or 
        saved detector settings.
    VideoResolution:
      properties:
        width:
          type: integer
          maximum: 32768.0
          exclusiveMinimum: 0.0
          title: Width
        height:
          type: integer
          maximum: 32768.0
          exclusiveMinimum: 0.0
          title: Height
      additionalProperties: false
      type: object
      required:
        - width
        - height
      title: VideoResolution
    ViewerBody:
      properties:
        view:
          type: string
          enum:
            - grid
            - detail
          title: View
          default: detail
        height:
          anyOf:
            - type: integer
              enum:
                - 360
                - 720
                - 1080
                - 2160
            - type: 'null'
          title: Height
        max_height:
          type: integer
          enum:
            - 720
            - 1080
            - 2160
          title: Max Height
          default: 1080
        audio:
          type: boolean
          title: Audio
          default: true
        force_relay:
          type: boolean
          title: Force Relay
          default: false
      additionalProperties: false
      type: object
      title: ViewerBody
      description: Viewers select a bounded quality, never camera URLs or media 
        destinations.
    VodStreamPreference:
      type: string
      enum:
        - main
        - sub
      title: VodStreamPreference
      description: |-
        Stream pin for the path-segment VOD route.

        nginx-vod derives its mapping fetch URI from the playlist URL path
        (query params are dropped), so the preference must be a path segment.
    WeatherSnapshot:
      properties:
        model_time:
          type: string
          format: date-time
          title: Model Time
        fetched_at:
          type: string
          format: date-time
          title: Fetched At
        interval_seconds:
          type: integer
          title: Interval Seconds
        temperature_c:
          anyOf:
            - type: number
            - type: 'null'
          title: Temperature C
        rain_mm:
          anyOf:
            - type: number
            - type: 'null'
          title: Rain Mm
        showers_mm:
          anyOf:
            - type: number
            - type: 'null'
          title: Showers Mm
        snowfall_cm:
          anyOf:
            - type: number
            - type: 'null'
          title: Snowfall Cm
        weather_code:
          anyOf:
            - type: integer
            - type: 'null'
          title: Weather Code
        cloud_cover_percent:
          anyOf:
            - type: number
            - type: 'null'
          title: Cloud Cover Percent
        wind_speed_mps:
          anyOf:
            - type: number
            - type: 'null'
          title: Wind Speed Mps
        wind_gusts_mps:
          anyOf:
            - type: number
            - type: 'null'
          title: Wind Gusts Mps
        is_day:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Is Day
        visibility_m:
          anyOf:
            - type: number
            - type: 'null'
          title: Visibility M
        visibility_model_time:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Visibility Model Time
        solar_days:
          items:
            $ref: '#/components/schemas/SolarDay'
          type: array
          title: Solar Days
        wind_direction_degrees:
          anyOf:
            - type: number
            - type: 'null'
          title: Wind Direction Degrees
        provider:
          type: string
          const: open-meteo
          title: Provider
          default: open-meteo
        modeled:
          type: boolean
          const: true
          title: Modeled
          default: true
      type: object
      required:
        - model_time
        - fetched_at
        - interval_seconds
        - temperature_c
        - rain_mm
        - showers_mm
        - snowfall_cm
        - weather_code
        - cloud_cover_percent
        - wind_speed_mps
        - wind_gusts_mps
        - is_day
        - visibility_m
        - visibility_model_time
        - solar_days
      title: WeatherSnapshot
      description: Modeled weather values; missing measurements remain 
        explicitly unknown.
    WeatherStatus:
      properties:
        enabled:
          type: boolean
          title: Enabled
        state:
          type: string
          title: State
        data:
          anyOf:
            - $ref: '#/components/schemas/WeatherSnapshot'
            - type: 'null'
        error_code:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Code
        next_refresh_seconds:
          type: number
          title: Next Refresh Seconds
        service_running:
          type: boolean
          title: Service Running
      type: object
      required:
        - enabled
        - state
        - data
        - error_code
        - next_refresh_seconds
        - service_running
      title: WeatherStatus
  securitySchemes:
    frigateAdminAuth:
      type: apiKey
      in: cookie
      name: frigate_token
      description: Authenticated session whose resolved role is 'admin'. The 
        session is established via the JWT cookie issued by POST /login, or via 
        proxy auth headers (remote-user / remote-role) when Frigate runs behind 
        an authenticating reverse proxy.
    frigateUserAuth:
      type: apiKey
      in: cookie
      name: frigate_token
      description: Any authenticated session (role 'viewer' or higher), 
        established via the JWT cookie issued by POST /login, or via proxy auth 
        headers when Frigate runs behind an authenticating reverse proxy.
