        - stationary_threshold
        - total
      title: StationaryObjectsResponse
    SubmitPlusBody:
      properties:
        include_annotation:
          type: integer
          title: Include Annotation
          default: 1
      type: object
      title: SubmitPlusBody
    TimingCalibrationRequest:
      properties:
        duration_seconds:
          type: integer
          maximum: 900.0
          minimum: 30.0
          title: Duration Seconds
          default: 900
      additionalProperties: false
      type: object
      title: TimingCalibrationRequest
      description: A short original-detector reference, never a permanent 
        detection setting.
    ToolExecuteRequest:
      properties:
        tool_name:
          type: string
          title: Tool Name
        arguments:
          additionalProperties: true
          type: object
          title: Arguments
      type: object
      required:
        - tool_name
        - arguments
      title: ToolExecuteRequest
      description: Request model for tool execution.
    TriggerEmbeddingBody:
      properties:
        type:
          $ref: '#/components/schemas/TriggerType'
        data:
