          title: Data
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
          default: 0.5
      type: object
      required:
        - type
        - data
      title: TriggerEmbeddingBody
    TriggerType:
      type: string
      enum:
        - thumbnail
        - description
