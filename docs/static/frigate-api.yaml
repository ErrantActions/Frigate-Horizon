          type: array
          maxItems: 7
          title: Metadata Categories
          description: Explicitly selected investigation context embedded in the
            exported MP4 comment. Empty by default. May include sensitive 
            identities; unavailable context is labeled.
        timestamp:
          $ref: '#/components/schemas/ExportTimestampMode'
          description: 'Optional capture-timeline labels: subtitle, burn_in, or both.
            Realtime recording exports only; source recordings are unchanged.'
          default: none
        source:
          $ref: '#/components/schemas/PlaybackSourceEnum'
          title: Playback source
          default: recordings
        name:
          anyOf:
            - type: string
              maxLength: 256
            - type: 'null'
          title: Friendly name
        image_path:
          type: string
          title: Image Path
        export_case_id:
          anyOf:
            - type: string
              maxLength: 30
            - type: 'null'
          title: Export case ID
          description: ID of the export case to assign this export to
        chapters:
          anyOf:
            - $ref: '#/components/schemas/ChaptersEnum'
            - type: 'null'
          title: Chapter mode
          description: Optional chapter metadata to embed in the export. When 
            omitted, the camera's configured export chapter mode is used.
        stream:
          $ref: '#/components/schemas/ExportStreamEnum'
          title: Recorded stream to export
          description: Which recorded stream to export. 'auto' uses the merged 
            timeline, preferring the main stream and falling back to the sub 
            stream where main has aged out. 'main' or 'sub' pins the export to 
            that stream alone.
          default: auto
      type: object
      title: ExportRecordingsBody
    ExportRecordingsCustomBody:
      properties:
        timestamp:
          type: string
          const: none
          title: Timestamp
          description: Custom-speed timestamp mapping is not certified; only 
            none is accepted.
          default: none
        metadata_categories:
          items:
            $ref: '#/components/schemas/ExportMetadataCategory'
          type: array
          maxItems: 0
          title: Metadata Categories
          description: Investigation context is supported on realtime recording 
            exports only.
        source:
          $ref: '#/components/schemas/PlaybackSourceEnum'
          title: Playback source
          default: recordings
        name:
          type: string
          maxLength: 256
          title: Friendly name
        image_path:
          type: string
          title: Image Path
        export_case_id:
          anyOf:
            - type: string
              maxLength: 30
            - type: 'null'
          title: Export case ID
          description: ID of the export case to assign this export to
        ffmpeg_input_args:
          anyOf:
            - type: string
            - type: 'null'
          title: FFmpeg input arguments
          description: Custom FFmpeg input arguments. If not provided, defaults 
            to timelapse input args.
        ffmpeg_output_args:
          anyOf:
            - type: string
            - type: 'null'
          title: FFmpeg output arguments
          description: Custom FFmpeg output arguments. If not provided, defaults
            to timelapse output args.
        cpu_fallback:
          type: boolean
          title: CPU Fallback
          description: If true, retry export without hardware acceleration if 
            the initial export fails.
          default: false
      type: object
      title: ExportRecordingsCustomBody
