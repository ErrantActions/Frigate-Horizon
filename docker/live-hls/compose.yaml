services:
  live-hls:
    image: ${HORIZON_LIVE_HLS_IMAGE:?Set the verified shared-clock packager digest}
    environment:
      HORIZON_HLS_SHARED_CLOCK: "1"
    network_mode: service:frigate
    depends_on:
      - frigate
    command:
      - /run/live-hls/mediamtx.yml
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./config/.live-hls
        target: /run/live-hls
        read_only: true
        bind:
          create_host_path: false
